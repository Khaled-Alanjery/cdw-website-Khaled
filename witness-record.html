<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="shared-style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Witness Record</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="https://use.typekit.net/yoz2aka.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#333333; --panel:#333333; --ink:#f4f4f4; --muted:#a8a8a8; --line:#4d4d4d;
    --w2:#6a6a6a; --w3:#9a9a9a;
    --gutter:40px;
    --good:#ff00ff; --bad:#ff0000;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"futura-pt", Helvetica, Arial, sans-serif; }
  #shell{ display:flex; flex-direction:column; height:100vh; }

  .nav-tab-witness .nt-box{ left:428px; top:23px; width:66px; height:23px; }
  .nav-tab-witness .nt-label{ left:428px; top:56px; }

  header{ margin:100px var(--gutter) 0 var(--gutter); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding-bottom:10px; }
  header h1{ font-family:"fayte-pixel-soft",Georgia,serif; font-size:16px; font-weight:500; margin:0; }
  .hdr-btn{ font:inherit; font-size:11px; border:1px solid var(--line); background:none; color:var(--ink); border-radius:5px; cursor:pointer; padding:4px 10px; }
  .hdr-btn:hover{ background:rgba(244,244,244,0.12); }
  .seg{ display:flex; border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  .seg button{ font:inherit; font-size:11px; border:none; background:var(--panel); color:var(--muted); padding:4px 10px; cursor:pointer; }
  .seg button + button{ border-left:1px solid var(--line); }
  .seg button:hover{ color:var(--ink); }
  .seg button.active{ background:rgba(244,244,244,0.12); color:var(--ink); }
  #status{ margin-left:auto; font-size:11px; color:var(--muted); display:flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums; }
  #status-dot{ width:8px; height:8px; border-radius:50%; background:var(--w2); }
  #status.live #status-dot{ background:var(--ink); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 50%{ opacity:.25; } }

  #main{ flex:1; display:flex; gap:1px; background:var(--line); overflow:hidden; margin:0 var(--gutter) var(--gutter); border-bottom:1px solid var(--line); min-height:0; }
  #pane-charts{ flex:1.6; }
  #right-col{ flex:1; min-width:320px; display:flex; flex-direction:column; gap:1px; overflow:hidden; }
  .pane{ background:var(--panel); position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .pane-head{ margin:8px 14px; border-bottom:1px solid var(--line); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; align-items:center; padding-bottom:4px; }
  .pane-body{ flex:1; position:relative; overflow:auto; }

  #charts{ display:flex; flex-direction:column; height:100%; }
  #charts-m{ flex:3; display:flex; flex-direction:column; min-height:0; }
  #radar{ flex:2.2; min-height:220px; position:relative; margin:32px 0 20px; }
  #radar .chart-label{ top:4px; }
  #radar canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .chart{ flex:1; min-height:110px; position:relative; border-bottom:1px dotted var(--line); }
  .chart-label{ position:absolute; left:14px; top:8px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); z-index:2; }
  .chart-label b{ color:var(--ink); font-weight:600; font-size:12px; letter-spacing:0; text-transform:none; margin-left:6px; font-variant-numeric:tabular-nums; }
  .chart svg{ width:100%; height:100%; display:block; }
  .chart .axis text{ fill:var(--muted); font-size:9px; font-family:"IBM Plex Mono", monospace; }
  .chart .axis path, .chart .axis line{ stroke:var(--line); }
  .chart .band{ fill:rgba(244,244,244,0.05); }
  .chart .thr{ stroke:var(--w2); stroke-dasharray:2 3; }
  .chart .thr-label{ fill:var(--w3); font-size:9px; font-family:"IBM Plex Mono", monospace; }
  .chart .line{ fill:none; stroke:var(--ink); stroke-width:1.4; }
  .chart .dot{ fill:var(--ink); }

  #pane-score{ flex:0 0 auto; }
  #score-body{ margin:4px 14px 14px; }
  #strip{ height:22px; border-radius:3px; background:var(--w2); transition:background .6s ease; }
  #score-big{ font-family:"fayte-pixel-soft",Georgia,serif; font-size:44px; line-height:1; margin:12px 0 0; font-variant-numeric:tabular-nums; }

  #pane-read{ flex:0 0 auto; }
  #pane-read .pane-body{ margin:0 14px 12px; overflow:visible; }
  .dash-row{ display:flex; justify-content:space-between; font-size:12px; margin:7px 0; padding-bottom:3px; line-height:1.6; border-bottom:1px dotted var(--line); gap:10px; }
  .dash-row .k{ color:var(--muted); }
  .dash-row .v{ text-align:right; font-variant-numeric:tabular-nums; }

  #pane-log{ flex:1; min-height:140px; }
  #pane-log .pane-body{ margin:0 14px 12px; }
  .log-row{ font-size:11px; margin:5px 0; padding-bottom:3px; border-bottom:1px dotted var(--line); display:flex; gap:8px; line-height:1.5; }
  .log-row .t{ color:var(--muted); font-family:"IBM Plex Mono", monospace; font-size:10px; flex:0 0 auto; padding-top:1px; }
  .log-row.rise{ border-left:2px solid rgba(244,244,244,0.55); padding-left:6px; }

  @media (max-width:900px){
    #shell{ height:auto; min-height:100vh; }
    #main{ flex-direction:column; overflow:visible; }
    #pane-charts{ min-height:520px; }
    #right-col{ min-width:0; overflow:visible; }
  }
</style>
</head>
<body>
<nav id="site-nav">
  <a class="nav-tab nav-tab-prosthesis" href="prosthesis-memoir.html"><span class="nt-box"></span><span class="nt-label">Prosthesis for Memoir</span></a>
  <a class="nav-tab nav-tab-matrix" href="adiliyah-mosque-matrix.html"><span class="nt-box"></span><span class="nt-label">Matrix</span></a>
  <a class="nav-tab nav-tab-carousel" href="carousel.html"><span class="nt-box"></span><span class="nt-label">Carousel</span></a>
  <a class="nav-tab nav-tab-witness current" href="witness-record.html"><span class="nt-box"></span><span class="nt-label">Witness</span></a>
</nav>

<div id="shell">
  <header>
    <h1>WITNESS RECORD</h1>
    <button class="hdr-btn" id="btn-connect">Connect</button>
    <div class="seg" id="seg-window">
      <button data-min="2">2 min</button>
      <button data-min="10" class="active">10 min</button>
      <button data-min="30">30 min</button>
    </div>
    <button class="hdr-btn" id="btn-csv">Export CSV</button>
    <div id="status"><span id="status-dot"></span><span id="status-text">Not connected</span></div>
  </header>

  <div id="main">
    <section class="pane" id="pane-charts">
      <div class="pane-head"><span>Record</span><span id="rec-count"></span></div>
      <div class="pane-body"><div id="charts"><div id="charts-m"></div><div id="radar"><div class="chart-label">Air quality</div><canvas></canvas></div></div></div>
    </section>

    <div id="right-col">
      <section class="pane" id="pane-score">
        <div class="pane-head"><span>Air score</span></div>
        <div id="score-body">
          <div id="strip"></div>
          <div id="score-big">--</div>
        </div>
      </section>

      <section class="pane" id="pane-read">
        <div class="pane-head"><span>Readings</span><span id="last-seen"></span></div>
        <div class="pane-body" id="readings"></div>
      </section>

      <section class="pane" id="pane-log">
        <div class="pane-head"><span>Log</span></div>
        <div class="pane-body" id="log"></div>
      </section>
    </div>
  </div>
</div>

<script>
const BAUD = 9600;
const METRICS = [
  { key:'t',     label:'Temperature', unit:'°C',  fmt:d3.format('.1f'), pad:1 },
  { key:'h',     label:'Humidity',    unit:'%',   fmt:d3.format('.0f'), pad:4,  band:[30, 60] },
  { key:'co2',   label:'CO2',         unit:'ppm', fmt:d3.format('.0f'), pad:60, thr:[800, 1500] }
];

let data = [], events = [];
let windowMin = 10;
let port = null, reader = null, reading = false;
let wasWarm = null, inRise = false;

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const stripColor = d3.interpolateRgb(css('--bad'), css('--good'));
const clock = d3.timeFormat('%H:%M:%S');
const $ = id => document.getElementById(id);

function num(s){ const v = parseFloat(s); return isFinite(v) ? v : null; }

function parseLine(line){
  const m = line.match(/T=([-\d.na]+)\s+H=([-\d.na]+).*?CO2=(-?\d+).*?score=(\d+)%/);
  if (!m) return null;
  const co2 = parseInt(m[3], 10);
  return { time:new Date(), t:num(m[1]), h:num(m[2]), co2: co2 > 0 ? co2 : null, score:+m[4], warm:/warming up/.test(line) };
}

async function connect(){
  if (!('serial' in navigator)){ log('Serial not supported in this browser'); return; }
  try{
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: BAUD });
  }catch(e){
    if (e.name !== 'NotFoundError') log('Port busy');
    port = null; return;
  }
  $('btn-connect').textContent = 'Disconnect';
  $('status').classList.add('live');
  $('status-text').textContent = 'Connected';
  log('Connected');
  reading = true;
  readLoop();
}

async function readLoop(){
  const decoder = new TextDecoderStream();
  const closed = port.readable.pipeTo(decoder.writable).catch(() => {});
  reader = decoder.readable.getReader();
  let buf = '';
  try{
    while (reading){
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf('\n')) >= 0){
        const r = parseLine(buf.slice(0, i).trim());
        buf = buf.slice(i + 1);
        if (r) ingest(r);
      }
    }
  }catch(e){
    log('Connection lost');
  }finally{
    try{ reader.releaseLock(); }catch(_){}
    await closed;
  }
}

async function disconnect(){
  reading = false;
  try{ if (reader) await reader.cancel(); }catch(_){}
  try{ if (port) await port.close(); }catch(_){}
  port = null; reader = null;
  $('btn-connect').textContent = 'Connect';
  $('status').classList.remove('live');
  $('status-text').textContent = 'Not connected';
  log('Disconnected');
}

function ingest(r){
  data.push(r);
  const cutoff = Date.now() - 3600 * 1000;
  while (data.length && data[0].time < cutoff) data.shift();

  if (wasWarm === true && !r.warm) log('CO2 ready');
  wasWarm = r.warm;

  if (!inRise && r.score < 75){ inRise = true; log('Rise, score ' + r.score + '%', true); }
  else if (inRise && r.score >= 95){ inRise = false; log('Baseline'); }

  render();
}

function render(){
  const last = data[data.length - 1];
  $('rec-count').textContent = data.length || '';
  if (last){
    $('strip').style.background = stripColor(last.score / 100);
    $('score-big').textContent = last.score + '%';
    $('last-seen').textContent = clock(last.time);
  }
  const row = (k, v) => `<div class="dash-row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  $('readings').innerHTML =
    row('Temperature', last && last.t != null ? last.t.toFixed(1) + ' °C' : '--') +
    row('Humidity',    last && last.h != null ? last.h.toFixed(0) + ' %' : '--') +
    row('CO2',         last && last.co2 != null ? last.co2 + ' ppm' : '--');
  renderCharts();
}

function renderCharts(){
  const now = Date.now();
  const x0 = new Date(now - windowMin * 60000), x1 = new Date(now);
  const win = data.filter(d => d.time >= x0);

  const charts = d3.select('#charts-m').selectAll('.chart').data(METRICS, d => d.key)
    .join(enter => {
      const c = enter.append('div').attr('class', 'chart');
      c.append('div').attr('class', 'chart-label').html(d => d.label + '<b></b>');
      const svg = c.append('svg');
      svg.append('rect').attr('class', 'band');
      svg.append('g').attr('class', 'thr-g');
      svg.append('path').attr('class', 'line');
      svg.append('circle').attr('class', 'dot').attr('r', 2.5);
      svg.append('g').attr('class', 'axis x');
      svg.append('g').attr('class', 'axis y');
      return c;
    });

  charts.each(function(m){
    const node = this.querySelector('svg'), svg = d3.select(node);
    const W = node.clientWidth || 600, H = node.clientHeight || 120;
    const M = { l:46, r:14, t:34, b:18 };
    const pts = win.filter(d => d[m.key] != null);
    const last = pts[pts.length - 1];
    d3.select(this).select('.chart-label b').text(last ? m.fmt(last[m.key]) + ' ' + m.unit : '');

    const x = d3.scaleTime().domain([x0, x1]).range([M.l, W - M.r]);
    const lo = (d3.min(pts, d => d[m.key]) ?? 0) - m.pad;
    const hi = (d3.max(pts, d => d[m.key]) ?? 1) + m.pad;
    const y = d3.scaleLinear().domain([lo, hi]).nice().range([H - M.b, M.t]);
    const [d0, d1] = y.domain();

    if (m.band){
      const top = y(Math.min(m.band[1], d1)), bot = y(Math.max(m.band[0], d0));
      svg.select('.band').attr('x', M.l).attr('width', W - M.l - M.r).attr('y', top).attr('height', Math.max(0, bot - top));
    }

    const thr = (m.thr || []).filter(v => v > d0 && v < d1);
    const g = svg.select('.thr-g').selectAll('g').data(thr).join(e => {
      const gg = e.append('g'); gg.append('line').attr('class', 'thr'); gg.append('text').attr('class', 'thr-label'); return gg;
    });
    g.select('line').attr('x1', M.l).attr('x2', W - M.r).attr('y1', y).attr('y2', y);
    g.select('text').attr('x', W - M.r - 2).attr('y', d => y(d) - 3).attr('text-anchor', 'end').text(d => d);

    const line = d3.line().defined(d => d[m.key] != null).x(d => x(d.time)).y(d => y(d[m.key]));
    svg.select('.line').attr('d', pts.length ? line(win) : null);
    svg.select('.dot').attr('display', last ? null : 'none')
      .attr('cx', last ? x(last.time) : 0).attr('cy', last ? y(last[m.key]) : 0);

    svg.select('.axis.x').attr('transform', `translate(0,${H - M.b})`)
      .call(d3.axisBottom(x).ticks(Math.max(2, Math.floor(W / 110))).tickFormat(d3.timeFormat(windowMin <= 2 ? '%H:%M:%S' : '%H:%M')).tickSizeOuter(0));
    svg.select('.axis.y').attr('transform', `translate(${M.l},0)`)
      .call(d3.axisLeft(y).ticks(3).tickSizeOuter(0));
  });

  renderRadar(win, x0, x1);
}

function renderRadar(win, x0, x1){
  const cv = document.querySelector('#radar canvas');
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== W * dpr || cv.height !== H * dpr){ cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const L = 14, Rt = W - 14, top = 44, bottom = H - 22;
  const gw = Rt - L, gh = bottom - top;

  const step = 5, dot = 2;
  const bins = Math.max(8, Math.floor(gw / step));
  const rowsN = Math.floor(gh / step / 2);
  const x0px = L + (gw - (bins - 1) * step) / 2;
  const yc = Math.round(top + gh / 2);

  const worst = new Array(bins).fill(null);
  const span = x1 - x0;
  for (const d of win){
    const i = Math.min(bins - 1, Math.floor((d.time - x0) / span * bins));
    if (worst[i] == null || d.score < worst[i]) worst[i] = d.score;
  }
  const pen = worst.map(v => v == null ? null : 1 - v / 100);
  const reach = 8;
  const grey = css('--w2');
  for (let i = 0; i < bins; i++){
    let p = -1;
    if (pen[i] != null){
      p = 0;
      for (let j = -reach; j <= reach; j++){
        const q = pen[i + j];
        if (q != null) p = Math.max(p, q * Math.exp(-(j * j) / 12));
      }
    }
    const rows = p < 0 ? -1 : Math.min(rowsN, Math.round(rowsN * 0.95 * p));
    const x = Math.round(x0px + i * step);
    for (let k = -rowsN; k <= rowsN; k++){
      const ak = Math.abs(k);
      if (ak <= rows){
        const f = rows ? ak / rows : 0;
        g.fillStyle = stripColor(1 - p * (1 - f * f));
      } else g.fillStyle = grey;
      g.fillRect(x - dot / 2, yc + k * step - dot / 2, dot, dot);
    }
  }

  const last = win[win.length - 1];
  const low = d3.min(win, d => d.score);
  g.font = '500 12px "IBM Plex Mono", monospace';
  g.textBaseline = 'top';
  g.fillStyle = css('--ink');
  g.textAlign = 'right';
  g.fillText('NOW ' + (last ? last.score + '%' : '--'), W - 14, 4);
  g.fillText('LOW ' + (low != null ? low + '%' : '--'), W - 14, 20);
  g.fillStyle = css('--muted');
  g.font = '400 9px "IBM Plex Mono", monospace';
  g.textAlign = 'left';  g.fillText('-' + windowMin + ' MIN', L, bottom + 6);
  g.textAlign = 'right'; g.fillText('NOW', Rt, bottom + 6);
}

function log(text, rise){
  events.unshift({ time:new Date(), text, rise });
  if (events.length > 200) events.pop();
  $('log').innerHTML = events.map(e =>
    `<div class="log-row${e.rise ? ' rise' : ''}"><span class="t">${clock(e.time)}</span><span>${e.text}</span></div>`).join('');
}

function exportCSV(){
  if (!data.length) return;
  const rows = data.map(d => [d.time.toISOString(), d.t ?? '', d.h ?? '', d.co2 ?? '', d.score].join(','));
  const blob = new Blob(['time,temp_c,humidity_pct,co2_ppm,score_pct\n' + rows.join('\n')], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'witness-record-' + d3.timeFormat('%Y%m%d-%H%M')(new Date()) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

$('btn-connect').onclick = () => port ? disconnect() : connect();
$('btn-csv').onclick = exportCSV;
document.querySelectorAll('#seg-window button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#seg-window button').forEach(x => x.classList.toggle('active', x === b));
  windowMin = +b.dataset.min;
  renderCharts();
});
window.addEventListener('resize', renderCharts);
setInterval(renderCharts, 5000);

const nav = $('site-nav');
document.addEventListener('scroll', () => nav.classList.toggle('is-scrolled', window.scrollY > 4), true);

render();
</script>
</body>
</html>
